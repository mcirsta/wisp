title: Local text and image links, reload and close
group: local
steps:
- action: launch
  launch-options:
  - enable_javascript=0
  language: en
- action: window-new
  tag: win1
- action: navigate
  window: win1
  path: local-navigation.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: First local page
  area:
  - 0
  - 0
  - 800
  - 600
- action: click
  window: win1
  target:
    text: Next page
- action: wait-loading
  window: win1
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: Second local page
- action: reload
  window: win1
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: Second local page
- action: navigate
  window: win1
  path: local-navigation.html
- action: block
  conditions:
  - window: win1
    status: complete
- action: click
  window: win1
  target:
    bitmap: 0
- action: wait-loading
  window: win1
- action: block
  conditions:
  - window: win1
    status: complete
- action: plot-check
  window: win1
  checks:
  - text-contains: Second local page
- action: window-close
  window: win1
- action: quit
