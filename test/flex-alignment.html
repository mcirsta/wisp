<!doctype html>
<meta charset="utf-8">
<title>Flex alignment with outer edges and positioned backgrounds</title>
<style>
html, body { margin: 0; font: 14px sans-serif; }
section { margin: 10px; }
.card { position: relative; display: flex; flex-direction: column; justify-content: flex-end;
        width: 250px; height: 400px; background: #bcd; }
.panel { position: relative; display: flex; flex-direction: column; justify-content: flex-end;
         padding: 34px; background: #246; color: white; }
.content { height: 100px; }
.background { position: absolute; top: 0; left: 0; width: 100%; height: 400px; }
.row { flex-direction: row; width: 400px; height: 200px; }
.row .panel { width: 100px; }
</style>
<!-- Fixed content dimensions keep these assertions independent of fonts. -->
<section>Column end<div class="card" id="end"><div class="panel" id="end-panel"><div class="content"></div></div></div></section>
<section>Column center<div class="card" id="center" style="justify-content:center"><div class="panel" id="center-panel"><div class="content"></div></div></div></section>
<section>Column reverse end<div class="card" id="reverse" style="flex-direction:column-reverse"><div class="panel" id="reverse-panel"><div class="content"></div></div></div></section>
<section>Border and margin<div class="card" id="edges"><div class="panel" id="edges-panel" style="padding:20px;border:5px solid black;margin-bottom:10px"><div class="content"></div></div></div></section>
<section>Percentage minimum<div class="card" id="minimum"><div class="panel" id="minimum-panel" style="box-sizing:border-box;min-height:50%"><div class="content" id="minimum-content"></div></div></div></section>
<section>HotNews structure<div class="card" id="background" style="height:auto;aspect-ratio:5/8"><div class="background" id="background-image"></div><div class="panel" id="background-panel" style="box-sizing:border-box;min-height:50%"><div class="content" id="background-content"></div></div></div></section>
<section>Auto margin and background<div class="card" id="auto"><div class="background" id="auto-image"></div><div class="panel" id="auto-panel" style="margin-top:auto"><div class="content"></div></div></div></section>
<section>Growth and background<div class="card" id="grow"><div class="background" id="grow-image"></div><div class="panel" id="grow-panel" style="flex-grow:1"><div class="content"></div></div></div></section>
<section>Row end<div class="card row" id="row"><div class="panel" id="row-panel"><div class="content"></div></div></div></section>
<section>Row center<div class="card row" id="row-center" style="justify-content:center"><div class="panel" id="row-center-panel"><div class="content"></div></div></div></section>
<section>Row reverse end<div class="card row" id="row-reverse" style="flex-direction:row-reverse"><div class="panel" id="row-reverse-panel"><div class="content"></div></div></div></section>
