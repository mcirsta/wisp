<!doctype html><meta charset="utf-8"><title>Grid rows</title><!-- Row tracks, content distribution and flexible fractions.
Bundled font and explicit content sizes make geometry reproducible.
The checkbox changes the definite height through native :checked restyling. -->
<style>
@font-face{font-family:Test;src:url(fonts/normal-400.ttf)}
body{margin:20px;font:16px/20px Test}.case{display:flow-root;width:240px;margin-bottom:50px;background:#eee}
.grid{display:grid;width:100px;background:#58a}.grid i{display:block;background:#a85}.grid b{display:block;background:#8b5}
#switch{position:absolute;left:300px;top:0}#switch:checked ~ .case .grid{height:140px!important;min-height:0!important;max-height:none!important}
</style><input id="switch" type="checkbox" aria-label="Change row sizes">
<div class="case" id="default-case"><div class="grid" id="default-grid" style="height:100px"><i id="default-0" style="height:10px;"><b style="height:10px"></b></i><i id="default-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="explicit-auto-case"><div class="grid" id="explicit-auto-grid" style="height:100px;grid-template-rows:auto auto"><i id="explicit-auto-0" style="height:10px;"><b style="height:10px"></b></i><i id="explicit-auto-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="auto-end-case"><div class="grid" id="auto-end-grid" style="height:60px"><i id="auto-end-0" style="height:10px;align-self:end"><b style="height:10px"></b></i></div></div>
<div class="case" id="start-case"><div class="grid" id="start-grid" style="height:110px;row-gap:10px;align-content:start"><i id="start-0" style="height:10px;"><b style="height:10px"></b></i><i id="start-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="end-case"><div class="grid" id="end-grid" style="height:110px;row-gap:10px;align-content:end"><i id="end-0" style="height:10px;"><b style="height:10px"></b></i><i id="end-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="center-case"><div class="grid" id="center-grid" style="height:110px;row-gap:10px;align-content:center"><i id="center-0" style="height:10px;"><b style="height:10px"></b></i><i id="center-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="space-between-case"><div class="grid" id="space-between-grid" style="height:110px;row-gap:10px;align-content:space-between"><i id="space-between-0" style="height:10px;"><b style="height:10px"></b></i><i id="space-between-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="space-around-case"><div class="grid" id="space-around-grid" style="height:110px;row-gap:10px;align-content:space-around"><i id="space-around-0" style="height:10px;"><b style="height:10px"></b></i><i id="space-around-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="space-evenly-case"><div class="grid" id="space-evenly-grid" style="height:110px;row-gap:10px;align-content:space-evenly"><i id="space-evenly-0" style="height:10px;"><b style="height:10px"></b></i><i id="space-evenly-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="stretch-case"><div class="grid" id="stretch-grid" style="height:110px;row-gap:10px;align-content:stretch"><i id="stretch-0" style="height:10px;"><b style="height:10px"></b></i><i id="stretch-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fixed-case"><div class="grid" id="fixed-grid" style="height:100px;grid-template-rows:20px 30px"><i id="fixed-0" style="height:10px;"><b style="height:10px"></b></i><i id="fixed-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fixed-stretch-case"><div class="grid" id="fixed-stretch-grid" style="height:100px;grid-template-rows:20px 30px"><i id="fixed-stretch-0"><b style="height:10px"></b></i><i id="fixed-stretch-1"><b style="height:10px"></b></i></div></div>
<div class="case" id="em-case"><div class="grid" id="em-grid" style="font-size:20px;grid-template-rows:1em 1.5em"><i id="em-0" style="height:10px;"><b style="height:10px"></b></i><i id="em-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="empty-rows-case"><div class="grid" id="empty-rows-grid" style="grid-template-rows:20px 30px;row-gap:10px"></div></div>
<div class="case" id="fr-case"><div class="grid" id="fr-grid" style="height:100px;grid-template-rows:1fr 3fr"><i id="fr-0" style="height:10px;"><b style="height:10px"></b></i><i id="fr-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-gap-case"><div class="grid" id="fr-gap-grid" style="height:110px;grid-template-rows:1fr 1fr;row-gap:10px"><i id="fr-gap-0"><b style="height:10px"></b></i><i id="fr-gap-1"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-minimum-case"><div class="grid" id="fr-minimum-grid" style="height:100px;grid-template-rows:1fr 3fr"><i id="fr-minimum-0" style="height:50px;"><b style="height:10px"></b></i><i id="fr-minimum-1" style="height:10px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-overflow-case"><div class="grid" id="fr-overflow-grid" style="height:40px;grid-template-rows:1fr 1fr"><i id="fr-overflow-0" style="height:50px;"><b style="height:10px"></b></i><i id="fr-overflow-1" style="height:10px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-small-case"><div class="grid" id="fr-small-grid" style="height:100px;grid-template-rows:.2fr .3fr"><i id="fr-small-0"><b style="height:10px"></b></i><i id="fr-small-1"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-auto-case"><div class="grid" id="fr-auto-grid" style="grid-template-rows:1fr 2fr"><i id="fr-auto-0" style="height:30px;"><b style="height:10px"></b></i><i id="fr-auto-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-auto-max-case"><div class="grid" id="fr-auto-max-grid" style="max-height:60px;grid-template-rows:1fr 2fr"><i id="fr-auto-max-0" style="height:30px;"><b style="height:10px"></b></i><i id="fr-auto-max-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-auto-min-case"><div class="grid" id="fr-auto-min-grid" style="min-height:120px;grid-template-rows:1fr 2fr"><i id="fr-auto-min-0" style="height:30px;"><b style="height:10px"></b></i><i id="fr-auto-min-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="auto-fr-case"><div class="grid" id="auto-fr-grid" style="height:100px;grid-template-rows:auto 1fr"><i id="auto-fr-0" style="height:10px;"><b style="height:10px"></b></i><i id="auto-fr-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="fr-fixed-case"><div class="grid" id="fr-fixed-grid" style="height:100px;grid-template-rows:20px 1fr"><i id="fr-fixed-0" style="height:10px;"><b style="height:10px"></b></i><i id="fr-fixed-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="auto-fixed-case"><div class="grid" id="auto-fixed-grid" style="height:100px;grid-template-rows:auto 20px"><i id="auto-fixed-0" style="height:10px;"><b style="height:10px"></b></i><i id="auto-fixed-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="percent-case"><div class="grid" id="percent-grid" style="height:100px;grid-template-rows:20% 30%"><i id="percent-0" style="height:10px;"><b style="height:10px"></b></i><i id="percent-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="percent-auto-case"><div class="grid" id="percent-auto-grid" style="grid-template-rows:50% 50%"><i id="percent-auto-0" style="height:20px;"><b style="height:10px"></b></i><i id="percent-auto-1" style="height:40px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="minmax-fr-case"><div class="grid" id="minmax-fr-grid" style="height:100px;grid-template-rows:minmax(0,1fr) minmax(0,3fr)"><i id="minmax-fr-0" style="height:50px;"><b style="height:10px"></b></i><i id="minmax-fr-1" style="height:10px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="minmax-floor-case"><div class="grid" id="minmax-floor-grid" style="height:100px;grid-template-rows:minmax(50px,1fr) 3fr"><i id="minmax-floor-0" style="height:10px;"><b style="height:10px"></b></i><i id="minmax-floor-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="minmax-auto-case"><div class="grid" id="minmax-auto-grid" style="height:100px;grid-template-rows:minmax(20px,auto) 20px"><i id="minmax-auto-0" style="height:10px;"><b style="height:10px"></b></i><i id="minmax-auto-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="minmax-cap-case"><div class="grid" id="minmax-cap-grid" style="height:100px;grid-template-rows:minmax(10px,30px) 20px"><i id="minmax-cap-0" style="height:10px;"><b style="height:10px"></b></i><i id="minmax-cap-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="minmax-intrinsic-case"><div class="grid" id="minmax-intrinsic-grid" style="height:100px;grid-template-rows:minmax(auto,30px) 20px"><i id="minmax-intrinsic-0" style="height:50px;"><b style="height:10px"></b></i><i id="minmax-intrinsic-1" style="height:10px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="min-content-case"><div class="grid" id="min-content-grid" style="height:100px;grid-template-rows:min-content max-content"><i id="min-content-0" style="height:10px;"><b style="height:10px"></b></i><i id="min-content-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="span-case"><div class="grid" id="span-grid" style="height:110px;grid-template-columns:40px 40px;row-gap:10px;grid-template-rows:1fr 3fr"><i id="span-0" style="grid-column:1;grid-row:1 / span 2"><b style="height:10px"></b></i><i id="span-1" style="height:10px;grid-column:2;grid-row:1"><b style="height:10px"></b></i><i id="span-2" style="height:20px;grid-column:2;grid-row:2"><b style="height:10px"></b></i></div></div>
<div class="case" id="span-auto-case"><div class="grid" id="span-auto-grid" style="height:110px;grid-template-columns:40px 40px;row-gap:10px"><i id="span-auto-0" style="grid-column:1;grid-row:1 / span 2"><b style="height:10px"></b></i><i id="span-auto-1" style="height:10px;grid-column:2;grid-row:1"><b style="height:10px"></b></i><i id="span-auto-2" style="height:20px;grid-column:2;grid-row:2"><b style="height:10px"></b></i></div></div>
<div class="case" id="overflow-center-case"><div class="grid" id="overflow-center-grid" style="height:20px;align-content:center"><i id="overflow-center-0" style="height:10px;"><b style="height:10px"></b></i><i id="overflow-center-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="overflow-around-case"><div class="grid" id="overflow-around-grid" style="height:20px;align-content:space-around"><i id="overflow-around-0" style="height:10px;"><b style="height:10px"></b></i><i id="overflow-around-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="minimum-case"><div class="grid" id="minimum-grid" style="min-height:100px"><i id="minimum-0" style="height:10px;"><b style="height:10px"></b></i><i id="minimum-1" style="height:20px;"><b style="height:10px"></b></i></div></div>
<div class="case" id="nested-flex-case"><div class="grid" id="nested-flex-grid" style="height:100px;grid-template-rows:1fr 1fr"><i id="nested-flex-0" style="display:flex;align-items:end"><b style="height:10px"></b></i><i id="nested-flex-1" style="display:grid;align-content:end"><b style="height:10px"></b></i></div></div>
<div class="case" id="resizable-case"><div class="grid" id="resizable-grid" style="height:50vw;grid-template-rows:1fr 3fr"><i id="resizable-0"><b style="height:10px"></b></i><i id="resizable-1"><b style="height:10px"></b></i></div></div>
