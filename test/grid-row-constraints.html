<!doctype html><meta charset="utf-8"><title>Grid rows</title><!-- Track minima, spanning contributions and cyclic percentages.
Bundled font and explicit content sizes make geometry reproducible.
The checkbox changes the definite height through native :checked restyling. -->
<style>
@font-face{font-family:Test;src:url(fonts/normal-400.ttf)}
body{margin:20px;font:16px/20px Test}.case{display:flow-root;width:240px;margin-bottom:50px;background:#eee}
.grid{display:grid;width:100px;background:#58a}.grid i{display:block;background:#a85}.grid b{display:block;background:#8b5}
#switch{position:absolute;left:300px;top:0}#switch:checked ~ .case .grid{height:140px!important;min-height:0!important;max-height:none!important}
</style><input id="switch" type="checkbox" aria-label="Change row sizes">
<div class="case" id="shrink-auto-case"><div class="grid" id="shrink-auto-grid" style="height:20px;grid-template-rows:auto"><i id="shrink-auto-0" style="min-height:0"><b style="height:60px"></b></i></div></div>
<div class="case" id="shrink-fr-case"><div class="grid" id="shrink-fr-grid" style="height:20px;grid-template-rows:1fr"><i id="shrink-fr-0" style="min-height:0"><b style="height:60px"></b></i></div></div>
<div class="case" id="scroll-fr-case"><div class="grid" id="scroll-fr-grid" style="height:20px;grid-template-rows:1fr"><i id="scroll-fr-0" style="overflow:auto"><b style="height:60px"></b></i></div></div>
<div class="case" id="hidden-fr-case"><div class="grid" id="hidden-fr-grid" style="height:20px;grid-template-rows:1fr"><i id="hidden-fr-0" style="overflow:hidden"><b style="height:60px"></b></i></div></div>
<div class="case" id="minmax-content-case"><div class="grid" id="minmax-content-grid" style="height:20px;grid-template-rows:minmax(0,auto)"><i id="minmax-content-0"><b style="height:60px"></b></i></div></div>
<div class="case" id="cap-auto-case"><div class="grid" id="cap-auto-grid" style="height:100px;grid-template-rows:minmax(auto,30px)"><i id="cap-auto-0"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-fr-case"><div class="grid" id="span-fr-grid" style="height:80px;grid-template-rows:1fr 3fr"><i id="span-fr-0" style="grid-row:1 / span 2"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-fr-fixed-case"><div class="grid" id="span-fr-fixed-grid" style="height:80px;grid-template-rows:1fr 3fr"><i id="span-fr-fixed-0" style="height:100px;grid-row:1 / span 2"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-fr-auto-case"><div class="grid" id="span-fr-auto-grid" style="grid-template-rows:1fr 3fr"><i id="span-fr-auto-0" style="height:100px;grid-row:1 / span 2"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-mixed-auto-case"><div class="grid" id="span-mixed-auto-grid" style="grid-template-rows:20px 1fr 2fr"><i id="span-mixed-auto-0" style="height:120px;grid-row:1 / span 3"><b style="height:60px"></b></i></div></div>
<div class="case" id="percent-minmax-case"><div class="grid" id="percent-minmax-grid" style="grid-template-rows:minmax(50%,auto)"><i id="percent-minmax-0"><b style="height:60px"></b></i></div></div>
<div class="case" id="percent-max-case"><div class="grid" id="percent-max-grid" style="grid-template-rows:minmax(0,50%)"><i id="percent-max-0"><b style="height:60px"></b></i></div></div>
<div class="case" id="minmax-overflow-case"><div class="grid" id="minmax-overflow-grid" style="height:20px;grid-template-rows:minmax(0,30px)"><i id="minmax-overflow-0"><b style="height:60px"></b></i></div></div>
<div class="case" id="fixed-zero-case"><div class="grid" id="fixed-zero-grid" style="height:100px;grid-template-rows:0px 20px"><i id="fixed-zero-0"><b style="height:60px"></b></i><i id="fixed-zero-1"><b style="height:60px"></b></i></div></div>
<div class="case" id="fr-zero-case"><div class="grid" id="fr-zero-grid" style="height:100px;grid-template-rows:0fr 1fr"><i id="fr-zero-0"><b style="height:60px"></b></i><i id="fr-zero-1"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-auto-fr-case"><div class="grid" id="span-auto-fr-grid" style="height:180px;grid-template-columns:40px 40px;grid-template-rows:auto 1fr"><i id="span-auto-fr-0" style="height:100px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="span-auto-fr-1" style="height:10px;grid-row:1;grid-column:2"><b style="height:60px"></b></i><i id="span-auto-fr-2" style="height:10px;grid-row:2;grid-column:2"><b style="height:60px"></b></i></div></div>
<div class="case" id="overlap-forward-case"><div class="grid" id="overlap-forward-grid" style="grid-template-columns:30px 30px 30px"><i id="overlap-forward-0" style="height:80px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="overlap-forward-1" style="height:100px;grid-row:2 / span 2;grid-column:2"><b style="height:60px"></b></i><i id="overlap-forward-2" style="height:0px;grid-row:1;grid-column:3;align-self:end"><b style="height:60px"></b></i><i id="overlap-forward-3" style="height:0px;grid-row:2;grid-column:3;align-self:end"><b style="height:60px"></b></i><i id="overlap-forward-4" style="height:0px;grid-row:3;grid-column:3;align-self:end"><b style="height:60px"></b></i></div></div>
<div class="case" id="overlap-reverse-case"><div class="grid" id="overlap-reverse-grid" style="grid-template-columns:30px 30px 30px"><i id="overlap-reverse-0" style="height:100px;grid-row:2 / span 2;grid-column:2"><b style="height:60px"></b></i><i id="overlap-reverse-1" style="height:80px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="overlap-reverse-2" style="height:0px;grid-row:1;grid-column:3;align-self:end"><b style="height:60px"></b></i><i id="overlap-reverse-3" style="height:0px;grid-row:2;grid-column:3;align-self:end"><b style="height:60px"></b></i><i id="overlap-reverse-4" style="height:0px;grid-row:3;grid-column:3;align-self:end"><b style="height:60px"></b></i></div></div>
<!-- Spanning growth reaches finite limits before redistributing the remainder. -->
<div class="case" id="span-cap-auto-case" style=""><div class="grid" id="span-cap-auto-grid" style="grid-template-columns:40px 40px;grid-template-rows:minmax(auto,20px) auto"><i id="span-cap-auto-0" style="height:100px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="span-cap-auto-1" style="height:0px;grid-row:1;grid-column:2;align-self:end"><b style="height:60px"></b></i><i id="span-cap-auto-2" style="height:0px;grid-row:2;grid-column:2;align-self:end"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-cap-content-case" style=""><div class="grid" id="span-cap-content-grid" style="grid-template-columns:40px 40px;grid-template-rows:minmax(min-content,20px) auto"><i id="span-cap-content-0" style="height:100px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="span-cap-content-1" style="height:0px;grid-row:1;grid-column:2;align-self:end"><b style="height:60px"></b></i><i id="span-cap-content-2" style="height:0px;grid-row:2;grid-column:2;align-self:end"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-all-capped-case" style=""><div class="grid" id="span-all-capped-grid" style="grid-template-columns:40px 40px;grid-template-rows:minmax(auto,20px) minmax(auto,30px)"><i id="span-all-capped-0" style="height:100px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="span-all-capped-1" style="height:0px;grid-row:1;grid-column:2;align-self:end"><b style="height:60px"></b></i><i id="span-all-capped-2" style="height:0px;grid-row:2;grid-column:2;align-self:end"><b style="height:60px"></b></i></div></div>
<div class="case" id="span-cap-zero-case" style=""><div class="grid" id="span-cap-zero-grid" style="grid-template-columns:40px 40px;grid-template-rows:minmax(auto,0) auto"><i id="span-cap-zero-0" style="height:100px;grid-row:1 / span 2;grid-column:1"><b style="height:60px"></b></i><i id="span-cap-zero-1" style="height:0px;grid-row:1;grid-column:2;align-self:end"><b style="height:60px"></b></i><i id="span-cap-zero-2" style="height:0px;grid-row:2;grid-column:2;align-self:end"><b style="height:60px"></b></i></div></div>
