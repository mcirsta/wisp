<!doctype html>
<meta charset="utf-8">
<title>Flex shrink uses inner base sizes</title>
<style>
    body { margin: 0; }
    .case { display: flex; align-items: flex-start; margin-bottom: 8px; background: #eee; }
    .case > div { flex: 0 1 100px; min-width: 0; min-height: 0; background: #79c; }
    .case > .b { background: #c97; }
    .row { width: calc(100vw - 300px); height: 16px; }
    .row > div { width: 100px; height: 16px; }
    .column { height: calc(100vw - 300px); width: 16px; }
    .column > div { height: 100px; width: 16px; }
    .row.reverse { flex-direction: row-reverse; }
    .column { flex-direction: column; }
    .column.reverse { flex-direction: column-reverse; }
    .row.margin > .a, .row.auto-basis > .a, .row.weighted > .a,
    .row.inflexible > .a, .row.zero > .a, .row.growth > .a { margin-right: 100px; }
    .column.margin > .a, .column.auto-basis > .a, .column.weighted > .a,
    .column.inflexible > .a, .column.zero > .a, .column.growth > .a { margin-bottom: 100px; }
    .row.padding > .a, .row.minimum > .a, .row.maximum > .a { padding-right: 100px; }
    .column.padding > .a, .column.minimum > .a, .column.maximum > .a { padding-bottom: 100px; }
    .row.border > .a { border-right: 100px solid #975; }
    .column.border > .a { border-bottom: 100px solid #975; }
    .border-box > .a { box-sizing: border-box; flex-basis: 200px; }
    .row.border-box > .a { width: 200px; padding-right: 50px; border-right: 50px solid #975; }
    .column.border-box > .a { height: 200px; padding-bottom: 50px; border-bottom: 50px solid #975; }
    .auto-basis > div { flex-basis: auto; }
    .weighted > .a { flex-shrink: 3; }
    .row.minimum > .a { min-width: 80px; }
    .column.minimum > .a { min-height: 80px; }
    .row.maximum > .a { max-width: 60px; }
    .column.maximum > .a { max-height: 60px; }
    .row.maximum { width: calc(100vw - 260px); }
    .column.maximum { height: calc(100vw - 260px); }
    .inflexible > .a { flex-shrink: 0; }
    .row.negative > .a { margin-right: -40px; }
    .column.negative > .a { margin-bottom: -40px; }
    .zero > .a, .all-zero > div { flex-basis: 0; width: 0; height: 0; }
    .row.all-zero > div { margin-right: 100px; }
    .column.all-zero > div { margin-bottom: 100px; }
    .row.control, .row.negative, .row.all-zero { width: calc(100vw - 400px); }
    .column.control, .column.negative, .column.all-zero { height: calc(100vw - 400px); }
    .row.zero { width: calc(100vw - 350px); }
    .column.zero { height: calc(100vw - 350px); }
    .growth > div { flex-grow: 1; }
    .row.growth { width: calc(100vw - 100px); }
    .column.growth { height: calc(100vw - 100px); }
</style>

     exercises repeated layout without changing the items' 100px bases. -->
