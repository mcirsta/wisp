<!doctype html><meta charset="utf-8"><title>Grid area percentages</title><!-- Grid-area percentage sizing and stretched descendants.
Bundled font and explicit content sizes make geometry reproducible.
The checkbox changes the definite height through native :checked restyling. -->
<style>
@font-face{font-family:Test;src:url(fonts/normal-400.ttf)}body{margin:20px;font:16px/20px Test}.case{display:flow-root;width:240px;margin-bottom:50px;background:#eee}
.grid{display:grid;width:100px;background:#58a}.item{background:#a85}.item b{display:block;background:#8b5}
#switch{position:absolute;left:300px;top:0}#switch:checked ~ .case .grid{height:140px!important}
</style><input id="switch" type="checkbox" aria-label="Resize areas">
<div class="case" id="block-auto-case"><div class="grid" id="block-auto-grid" style="height:100px;align-content:start;"><div class="item" id="block-auto-item" style="display:block;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="block-fixed-case"><div class="grid" id="block-fixed-grid" style="height:100px;align-content:start;grid-template-rows:40px;"><div class="item" id="block-fixed-item" style="display:block;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="block-fr-case"><div class="grid" id="block-fr-grid" style="height:100px;align-content:start;grid-template-rows:1fr;"><div class="item" id="block-fr-item" style="display:block;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="flex-auto-case"><div class="grid" id="flex-auto-grid" style="height:100px;align-content:start;"><div class="item" id="flex-auto-item" style="display:flex;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="flex-fixed-case"><div class="grid" id="flex-fixed-grid" style="height:100px;align-content:start;grid-template-rows:40px;"><div class="item" id="flex-fixed-item" style="display:flex;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="flex-fr-case"><div class="grid" id="flex-fr-grid" style="height:100px;align-content:start;grid-template-rows:1fr;"><div class="item" id="flex-fr-item" style="display:flex;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="grid-auto-case"><div class="grid" id="grid-auto-grid" style="height:100px;align-content:start;"><div class="item" id="grid-auto-item" style="display:grid;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="grid-fixed-case"><div class="grid" id="grid-fixed-grid" style="height:100px;align-content:start;grid-template-rows:40px;"><div class="item" id="grid-fixed-item" style="display:grid;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="grid-fr-case"><div class="grid" id="grid-fr-grid" style="height:100px;align-content:start;grid-template-rows:1fr;"><div class="item" id="grid-fr-item" style="display:grid;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="minimum-case"><div class="grid" id="minimum-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="minimum-item" style="min-height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="maximum-case"><div class="grid" id="maximum-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="maximum-item" style="max-height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="limits-case"><div class="grid" id="limits-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="limits-item" style="height:90%;min-height:60%;max-height:40%"><b style="height:10px"></b></div></div></div>
<div class="case" id="calc-case"><div class="grid" id="calc-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="calc-item" style="height:calc(50% + 5px)"><b style="height:10px"></b></div></div></div>
<div class="case" id="padding-case"><div class="grid" id="padding-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="padding-item" style="height:50%;padding:5px;border:2px solid;box-sizing:border-box"><b style="height:10px"></b></div></div></div>
<div class="case" id="auto-container-case"><div class="grid" id="auto-container-grid"><div class="item" id="auto-container-item" style="height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="auto-fixed-case"><div class="grid" id="auto-fixed-grid" style="grid-template-rows:40px"><div class="item" id="auto-fixed-item" style="height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="auto-overflow-case"><div class="grid" id="auto-overflow-grid"><div class="item" id="auto-overflow-item" style="height:200%"><b style="height:10px"></b></div></div></div>
<div class="case" id="zero-case"><div class="grid" id="zero-grid" style="height:100px;grid-template-rows:0px"><div class="item" id="zero-item" style="height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="span-case"><div class="grid" id="span-grid" style="height:100px;grid-template-rows:20px 60px;row-gap:10px"><div class="item" id="span-item" style="grid-row:1 / span 2;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="distributed-span-case"><div class="grid" id="distributed-span-grid" style="height:100px;grid-template-rows:20px 40px;align-content:space-between"><div class="item" id="distributed-span-item" style="grid-row:1 / span 2;height:50%"><b style="height:10px"></b></div></div></div>
<div class="case" id="stretch-descendant-case"><div class="grid" id="stretch-descendant-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="stretch-descendant-item"><b id="stretch-descendant-b" style="height:50%"></b></div></div></div>
<div class="case" id="same-stretch-descendant-case"><div class="grid" id="same-stretch-descendant-grid" style="grid-template-rows:40px"><div class="item" id="same-stretch-descendant-item"><b style="height:40px"></b><b id="same-stretch-descendant-b" style="height:50%"></b></div></div></div>
<div class="case" id="auto-stretch-descendant-case"><div class="grid" id="auto-stretch-descendant-grid"><div class="item" id="auto-stretch-descendant-item"><b style="height:40px"></b><b id="auto-stretch-descendant-b" style="height:50%"></b></div></div></div>
<div class="case" id="percent-descendant-case"><div class="grid" id="percent-descendant-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="percent-descendant-item" style="height:50%"><b id="percent-descendant-b" style="height:50%"></b></div></div></div>
<div class="case" id="percent-auto-margin-case"><div class="grid" id="percent-auto-margin-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="percent-auto-margin-item" style="height:50%;margin-top:auto;margin-bottom:auto"><b style="height:10px"></b></div></div></div>
<div class="case" id="ratio-case"><div class="grid" id="ratio-grid" style="height:100px;grid-template-rows:40px"><div class="item" id="ratio-item" style="height:50%;width:40px;aspect-ratio:2/1"><b style="height:10px"></b></div></div></div>
<div class="case" id="border-width-basis-case"><div class="grid" id="border-width-basis-grid" style="height:100px;grid-template-columns:80px;grid-template-rows:60px"><div class="item" id="border-width-basis-item" style="height:50%;padding:10%;box-sizing:border-box"><b style="height:10px"></b></div></div></div>
<div class="case" id="nested-percent-padding-case"><div class="grid" id="nested-percent-padding-grid" style="height:100px;grid-template-columns:80px;grid-template-rows:60px"><div class="item" id="nested-percent-padding-item" style="display:grid;height:50%;padding:10%;box-sizing:border-box"><b style="height:10px"></b></div></div></div>
<div class="case" id="image-percent-case"><div class="grid" id="image-percent-grid" style="height:100px;grid-template-rows:40px"><img class="item" id="image-percent-item" style="width:40px;height:50%" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2220%22%3E%3Crect%20width%3D%2240%22%20height%3D%2220%22%20fill%3D%22red%22/%3E%3C/svg%3E"></div></div>
<div class="case" id="image-normal-case"><div class="grid" id="image-normal-grid" style="height:100px"><img class="item" id="image-normal-item" style="width:40px" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2220%22%3E%3Crect%20width%3D%2240%22%20height%3D%2220%22%20fill%3D%22red%22/%3E%3C/svg%3E"></div></div>
<div class="case" id="image-stretch-case"><div class="grid" id="image-stretch-grid" style="height:100px"><img class="item" id="image-stretch-item" style="width:40px;align-self:stretch" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2240%22%20height%3D%2220%22%3E%3Crect%20width%3D%2240%22%20height%3D%2220%22%20fill%3D%22red%22/%3E%3C/svg%3E"></div></div>
