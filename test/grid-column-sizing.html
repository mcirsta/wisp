<!doctype html><meta charset="utf-8"><title>CSS Grid column sizing</title>
<!-- Expected sizes are derived from CSS Grid 1 sections 7.2.1, 7.2.4 and 11.4-11.8:
https://www.w3.org/TR/css-grid-1/#track-sizing
https://www.w3.org/TR/css-grid-1/#algo-track-sizing
The paired JSON stores specification-derived geometry, not browser snapshots.
Fixed-size children avoid font-dependent widths. The checkbox changes width to
360px, the narrow viewport uses 240px, and the default width is 300px. -->
<style>
body { margin:20px; font-size:0; line-height:0; }
#switch { position:fixed; right:8px; top:8px; width:16px; height:16px; font-size:13px; z-index:10; }
.case { display:flow-root; width:300px; margin-bottom:50px; }
.grid { display:grid; width:calc(100vw - 120px); max-width:300px; align-items:start; }
.grid > div { margin:0; padding:0; border:0; min-height:10px; background:orange; }
.grid > div + div { background:blue; }
.word { display:inline-block; width:40px; height:10px; vertical-align:top; }
#switch:checked ~ .case > .grid { width:360px; max-width:none; }
</style><input id="switch" type="checkbox">
